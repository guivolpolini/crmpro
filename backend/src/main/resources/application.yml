spring:
  application:
    name: crmpro-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/crmpro_db}
    username: ${SPRING_DATASOURCE_USERNAME:crmpro_user}
    password: ${SPRING_DATASOURCE_PASSWORD:crmpro_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}
  servlet:
    context-path: /

# JWT Security Settings
jwt:
  secret: ${JWT_SECRET:4c9b986b245cfbc1865910fae7401f81d11ffbe81db577a45638a165eb340801}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 horas
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 dias

# Springdoc OpenAPI Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# Actuator Health Check
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# FreeLLMAPI AI Integration
ai:
  openai:
    base-url: ${OPENAI_BASE_URL:http://localhost:3001/v1}
    api-key: ${OPENAI_API_KEY:default_key}
    model: ${OPENAI_MODEL:auto}
